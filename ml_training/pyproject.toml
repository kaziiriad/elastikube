[project]
name = "k3s-autoscaler-ml"
version = "0.1.0"
description = "ML training pipeline for K3s autoscaler predictive scaling"
requires-python = ">=3.11"

# Python dependencies live in requirements.txt / requirements-dev.txt
# (kept separate from pyproject.toml so the production container can
# install with `pip install -r requirements.txt` without a build step).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["utils"]
