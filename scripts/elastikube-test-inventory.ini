# Ansible inventory for the elastikube test cluster (1+2) on poridhi-aws.
# Master reaches the public internet via its EIP; workers live in a private
# subnet and SSH to them goes through the master as a ProxyJump.

[master]
k3s-master ansible_host=3.0.26.68 ansible_user=ubuntu

[workers]
k3s-worker-1 ansible_host=10.0.10.36 ansible_user=ubuntu
k3s-worker-2 ansible_host=10.0.10.8 ansible_user=ubuntu

[k3s_cluster:children]
master
workers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -i /tmp/elastikube-test.pem ubuntu@3.0.26.68"
aws_region=ap-southeast-1
cluster_name=production-k3s
s3_bucket_name=k3s-models
ml_training_days=30
ml_training_node_selector=k3s-worker-1,k3s-worker-2

# Master-only vars
[master:vars]
cluster_name=production-k3s
aws_region=ap-southeast-1

# Workers-only vars
[workers:vars]
ml_training_image=k3s-ml-training:latest
