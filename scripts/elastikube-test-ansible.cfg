[defaults]
inventory = /mnt/e/custom_autoscaler/production/scripts/elastikube-test-inventory.ini
private_key_file = /tmp/elastikube-test.pem
remote_user = ubuntu
host_key_checking = False
stdout_callback = default
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/elastikube-test-facts
fact_caching_timeout = 7200
roles_path = /mnt/e/custom_autoscaler/production/infrastructure/ansible/roles

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3
scp_if_ssh = True
retries = 3
