[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_ssh_private_key_file=/home/poridhian/.ssh/elastikube-test.pem
ansible_user=ubuntu

[master]
k3s-master ansible_host=54.254.230.138

[workers:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p -i /home/poridhian/.ssh/elastikube-test.pem ubuntu@54.254.230.138"

[workers]
k3s-worker-1 ansible_host=10.0.10.134
k3s-worker-2 ansible_host=10.0.2.198

[k3s_cluster:children]
master
workers
