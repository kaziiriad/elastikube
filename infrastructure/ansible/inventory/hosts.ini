# Ansible Inventory Template for K3s Autoscaler Production
# IPs from Pulumi stack output

[all:vars]
ansible_python_interpreter=/usr/bin/python3
aws_region=ap-southeast-1

[master]
master-node ansible_host=10.0.2.157 ansible_user=ubuntu

[workers]
worker-node-1 ansible_host=10.0.2.53 ansible_user=ubuntu
worker-node-2 ansible_host=10.0.2.177 ansible_user=ubuntu

[k3s_cluster:children]
master
workers
