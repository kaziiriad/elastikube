# Ansible Inventory for K3s Autoscaler Production
# Uses SSH config host aliases for ProxyJump support

[all:vars]
ansible_python_interpreter=/usr/bin/python3
aws_region=ap-southeast-1
private_key=~/.ssh/MyKeyPair.pem
ssh_key_name=MyKeyPair

[master]
k3s-master

[workers]
k3s-worker-1
k3s-worker-2

[k3s_cluster:children]
master
workers