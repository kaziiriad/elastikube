---
# K3s Autoscaler Production - Cluster Deployment Playbook
# This playbook sets up:
# - K3s master with Prometheus (NodePort 30900 for Lambda access)
# - K3s worker nodes
# - S3 integration for autoscaler Lambda

- hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - common

- hosts: master
  become: true
  gather_facts: true
  roles:
    - k3s-master

- hosts: workers
  become: true
  gather_facts: true
  roles:
    - k3s-worker
