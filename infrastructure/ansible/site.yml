---
# K3s Autoscaler Production - Cluster Deployment Playbook
# This playbook sets up:
# - K3s master with Prometheus (NodePort 30900 for Lambda access)
# - K3s worker nodes
# - S3 integration for autoscaler Lambda (bootstrap script deployment)

- hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - common

- hosts: master
  become: true
  gather_facts: true
  roles:
    - k3s-master
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1

- hosts: workers
  become: true
  gather_facts: true
  roles:
    - k3s-worker

# Deploy worker bootstrap script to S3 for automated worker join during scale-up
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1
    s3_bucket: k3s-userdata-production-k3s
    s3_key: user-data/worker-bootstrap.sh
  roles:
    - k3s-worker-bootstrap
