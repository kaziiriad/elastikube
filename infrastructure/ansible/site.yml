---
# K3s Autoscaler Production - Cluster Deployment Playbook
# This playbook sets up:
# - K3s master with Prometheus (NodePort 30900 for Lambda access)
# - K3s worker nodes
# - S3 integration for autoscaler Lambda (bootstrap script deployment)
# - ML Training CronJob (optional, when deploy_ml_training flag is set)

- hosts: k3s_cluster
  become: true
  gather_facts: true
  roles:
    - common

- hosts: master
  become: true
  gather_facts: true
  roles:
    - k3s-master
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1

- hosts: workers
  become: true
  gather_facts: true
  roles:
    - k3s-worker

# Deploy worker bootstrap script to S3 for automated worker join during scale-up
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1
    s3_bucket: k3s-userdata-production-k3s
    s3_key: user-data/worker-bootstrap.sh
  roles:
    - k3s-worker-bootstrap

# Deploy ML Training CronJob (optional - only runs when deploy_ml_training=true)
# PHASE 1: Build Docker image on localhost
- hosts: localhost
  connection: local
  gather_facts: true
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1
    s3_bucket_name: k3s-models
    ml_training_days: 30
  tasks:
    - name: Build ML Training Docker image
      ansible.builtin.include_role:
        name: ml-training-cronjob
        tasks_from: build-image.yml
      when: deploy_ml_training | default(false) | bool

# PHASE 2: Distribute image to worker nodes
- hosts: workers
  become: true
  gather_facts: true
  vars:
    ml_training_image: k3s-ml-training:latest
  tasks:
    - name: Include image distribution tasks
      ansible.builtin.include_role:
        name: ml-training-cronjob
        tasks_from: distribute-image.yml
      when: deploy_ml_training | default(false) | bool
  serial: 1  # Distribute to workers one at a time

# PHASE 3: Deploy CronJob to cluster
- hosts: localhost
  connection: local
  gather_facts: true
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1
    s3_bucket_name: k3s-models
    ml_training_days: 30
  tasks:
    - name: Deploy ML Training CronJob
      ansible.builtin.include_role:
        name: ml-training-cronjob
        tasks_from: deploy-cronjob.yml
      when: deploy_ml_training | default(false) | bool

# ============================================================
# K3s Worker AMI Bake (optional - enable with bake_ami=true)
# Bakes AMI with pre-installed SSM Agent, awscli, curl, jq, k3s
# Then deploys bootstrap script to S3 using new AMI ID from SSM
# ============================================================
- hosts: localhost
  connection: local
  gather_facts: true
  vars:
    cluster_name: production-k3s
    aws_region: ap-southeast-1
    ssh_key_name: MyKeyPair
    base_ami_id: ami-0c687e8f5c4e54af5
    instance_type: t3.small
    s3_bucket: k3s-userdata-production-k3s
    s3_key: user-data/worker-bootstrap.sh
  environment:
    AWS_PROFILE: "{{ lookup('env', 'AWS_PROFILE') | default('k3s-temp-user', true) }}"
    AWS_REGION: "{{ aws_region }}"
  tasks:
    - name: Get current date for AMI naming
      ansible.builtin.shell: date +%Y%m%d-%H%M%S
      register: ami_date_output
      changed_when: false
      when: bake_ami | default(false) | bool

    - name: Get security group ID from SSM Parameter
      ansible.builtin.shell: |
        aws ssm get-parameter --name "/k3s/{{ cluster_name }}/security-group-id" \
          --query "Parameter.Value" --output text --region {{ aws_region }}
      register: sg_param
      changed_when: false
      when: bake_ami | default(false) | bool

    - name: Get subnet IDs from SSM Parameter
      ansible.builtin.shell: |
        aws ssm get-parameter --name "/k3s/{{ cluster_name }}/worker-subnet-ids" \
          --query "Parameter.Value" --output text --region {{ aws_region }}
      register: subnet_param
      changed_when: false
      when: bake_ami | default(false) | bool

    - name: Parse subnet IDs from JSON
      ansible.builtin.set_fact:
        subnet_ids: "{{ subnet_param.stdout | from_json }}"
        security_group_id: "{{ sg_param.stdout }}"
      when: bake_ami | default(false) | bool

    - name: Display bake configuration
      ansible.builtin.debug:
        msg:
          - "Baking AMI: {{ bake_ami }}"
          - "Cluster: {{ cluster_name }}"
          - "Base AMI: {{ base_ami_id }}"
          - "Instance type: {{ instance_type }}"
          - "Security Group: {{ security_group_id }}"
      when: bake_ami | default(false) | bool

    - name: Launch temporary instance for baking
      amazon.aws.ec2_instance:
        name: k3s-bake-temp
        image_id: "{{ base_ami_id }}"
        instance_type: "{{ instance_type }}"
        state: running
        wait: true
        wait_timeout: 300
        key_name: "{{ ssh_key_name }}"
        security_group: "{{ security_group_id }}"
        vpc_subnet_id: "{{ subnet_ids[0] }}"
        tags:
          BakePurpose: ami-bake
          Name: k3s-bake-temp
      register: bake_instance
      when: bake_ami | default(false) | bool

    - name: Wait for SSH connection to bake instance
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 120
        sleep: 5
      when: bake_ami | default(false) | bool

    - name: Run k3s-worker-preinstall role on bake instance
      ansible.builtin.shell: |
        ansible all -i "{{ bake_instance.instances[0].private_ip_address }}," \
          --ssh-common-args='-o StrictHostKeyChecking=no -o ProxyJump=k3s-bastion' \
          -u ubuntu \
          --private-key=~/.ssh/{{ ssh_key_name }}.pem \
          -m include_role -a "name=k3s-worker-preinstall"
      args:
        executable: /bin/bash
      changed_when: false
      when: bake_ami | default(false) | bool

    - name: Run k3s-agent-binary role on bake instance
      ansible.builtin.shell: |
        ansible all -i "{{ bake_instance.instances[0].private_ip_address }}," \
          --ssh-common-args='-o StrictHostKeyChecking=no -o ProxyJump=k3s-bastion' \
          -u ubuntu \
          --private-key=~/.ssh/{{ ssh_key_name }}.pem \
          -m include_role -a "name=k3s-agent-binary"
      args:
        executable: /bin/bash
      changed_when: false
      when: bake_ami | default(false) | bool

    - name: Create AMI from bake instance
      amazon.aws.ec2_ami:
        instance_id: "{{ bake_instance.instances[0].instance_id }}"
        name: "k3s-worker-{{ cluster_name }}-{{ ami_date_output.stdout }}"
        description: "K3s worker AMI with pre-installed SSM Agent, awscli, curl, jq, k3s binary"
        state: present
        wait: true
        wait_timeout: 600
        tags:
          Name: "k3s-worker-{{ cluster_name }}-{{ ami_date_output.stdout }}"
          Cluster: "{{ cluster_name }}"
          CreatedBy: ansible-bake
          Date: "{{ ami_date_output.stdout }}"
      register: ami_result
      when: bake_ami | default(false) | bool

    - name: Write AMI ID to SSM Parameter
      community.aws.ssm_parameter:
        name: "/k3s/{{ cluster_name }}/worker-ami-id"
        value: "{{ ami_result.image_id }}"
        string_type: String
        overwrite_value: always
      when: bake_ami | default(false) | bool

    - name: Display bake results
      ansible.builtin.debug:
        msg:
          - "AMI ID: {{ ami_result.image_id }}"
          - "AMI Name: k3s-worker-{{ cluster_name }}-{{ ami_date_output.stdout }}"
          - "SSM Parameter: /k3s/{{ cluster_name }}/worker-ami-id updated"
          - "Instance: {{ bake_instance.instances[0].instance_id }}"
      when: bake_ami | default(false) | bool

    - name: Terminate bake instance
      amazon.aws.ec2_instance:
        instance_ids:
          - "{{ bake_instance.instances[0].instance_id }}"
        state: terminated
        wait: true
        wait_timeout: 300
      when: bake_ami | default(false) | bool
