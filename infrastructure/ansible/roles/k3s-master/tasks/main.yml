---

# ==========================================
# K3s Master node setup
# ==========================================

- name: Download and install k3s server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-ip={{ ansible_default_ipv4.address }} --tls-san {{ ansible_default_ipv4.address }}" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to be ready
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    delay: 5
    timeout: 300

- name: Set kubeconfig permissions
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Get k3s node token
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false

- name: Get master node IP
  shell: hostname -I | awk '{print $1}'
  register: master_ip
  changed_when: false

- name: Display master info
  debug:
    msg: "Master IP: {{ master_ip.stdout }}, Token: {{ k3s_token.stdout[:20] }}..."

# ==========================================
# Taint master node to prevent regular workload scheduling
# ==========================================

- name: Get master node name
  shell: kubectl get nodes --no-headers | grep "control-plane" | awk '{print $1}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: master_node_name
  changed_when: false
  ignore_errors: true

- name: Taint master node with NoSchedule
  shell: |
    kubectl taint nodes {{ master_node_name.stdout }} node-role.kubernetes.io/control-plane=true:NoSchedule --overwrite
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: master_node_name.stdout != ""
  register: taint_result
  changed_when: true
  ignore_errors: true

- name: Display taint result
  debug:
    msg: "Master node {{ master_node_name.stdout }} tainted with NoSchedule to prevent regular workload scheduling"
  when: master_node_name.stdout != ""

- name: Install boto3 and botocore on master node
  ansible.builtin.pip:
    name:
      - boto3
      - botocore
    state: present
    executable: pip3

- name: Store K3s join token to Secrets Manager
  community.aws.secretsmanager_secret:
    name: "k3s-{{ cluster_name | default('production-k3s') }}-join-token"
    description: "K3s cluster join token for worker nodes"
    secret: "{{ k3s_token.stdout }}"
    state: present
    overwrite: true
    region: "{{ aws_region }}"
  register: aws_secret_result

- name: Show Secrets Manager storage result
  debug:
    msg: "K3s join token successfully stored in AWS Secrets Manager"

- name: Set master IP as fact for workers
  set_fact:
    master_node_ip: "{{ master_ip.stdout }}"
    k3s_cluster_token: "{{ k3s_token.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['workers'] }}"
  run_once: true

# ==========================================
# Deploy Monitoring Stack (node-exporter + Prometheus)
# ==========================================

- name: Copy monitoring manifests to master
  copy:
    src: files/
    dest: /tmp/monitoring/
    mode: '0644'

- name: Create monitoring namespace
  command: kubectl apply -f /tmp/monitoring/00-namespace.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy node-exporter DaemonSet
  command: kubectl apply -f /tmp/monitoring/00-node-exporter.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_exporter_deploy

- name: Wait for node-exporter pods to be ready
  command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=node-exporter -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: node_exporter_deploy.changed
  ignore_errors: true

- name: Deploy Prometheus service account
  command: kubectl apply -f /tmp/monitoring/01-serviceaccount.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Prometheus ConfigMap with custom scrape config
  command: kubectl apply -f /tmp/monitoring/02-configmap-prometheus.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: prometheus_config

- name: Deploy Prometheus rules ConfigMap
  command: kubectl apply -f /tmp/monitoring/02-configmap-rules.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Prometheus PVC
  command: kubectl apply -f /tmp/monitoring/03-pvc.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Prometheus deployment
  command: kubectl apply -f /tmp/monitoring/04-deployment.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: prometheus_deploy

- name: Deploy Prometheus services (ClusterIP + NodePort 30900)
  command: kubectl apply -f /tmp/monitoring/05-service.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for Prometheus deployment to be ready
  command: kubectl wait --for=condition=available deployment/prometheus -n monitoring --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: prometheus_deploy.changed
  ignore_errors: true

- name: Get Prometheus service status
  command: kubectl get svc -n monitoring
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: prometheus_status
  changed_when: false

- name: Get node-exporter pods status
  command: kubectl get pods -n kube-system -l app.kubernetes.io/name=node-exporter
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_exporter_status
  changed_when: false

- name: Display monitoring stack status
  debug:
    msg:
      - "Prometheus Services:"
      - "{{ prometheus_status.stdout_lines }}"
      - ""
      - "Node Exporter Pods:"
      - "{{ node_exporter_status.stdout_lines }}"

# ==========================================
# Deploy kube-state-metrics
# ==========================================

- name: Deploy kube-state-metrics service account
  command: kubectl apply -f /tmp/monitoring/06-kube-state-metrics-serviceaccount.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy kube-state-metrics cluster role
  command: kubectl apply -f /tmp/monitoring/07-kube-state-metrics-cluster-role.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy kube-state-metrics cluster role binding
  command: kubectl apply -f /tmp/monitoring/08-kube-state-metrics-cluster-role-binding.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy kube-state-metrics deployment
  command: kubectl apply -f /tmp/monitoring/09-kube-state-metrics-deployment.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ksm_deploy

- name: Deploy kube-state-metrics service
  command: kubectl apply -f /tmp/monitoring/10-kube-state-metrics-service.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for kube-state-metrics deployment to be ready
  command: kubectl wait --for=condition=available deployment/kube-state-metrics -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: ksm_deploy.changed
  ignore_errors: true

- name: Get kube-state-metrics status
  command: kubectl get pods -n kube-system -l app.kubernetes.io/name=kube-state-metrics
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ksm_status
  changed_when: false

- name: Display kube-state-metrics status
  debug:
    msg:
      - "kube-state-metrics Pods:"
      - "{{ ksm_status.stdout_lines }}"

# ==========================================
# Install AWS SSM Agent (required for kubectl drain via Lambda)
# ==========================================

- name: Check if SSM Agent is installed
  shell: |
    if snap list amazon-ssm-agent 2>/dev/null | grep -q amazon-ssm-agent; then
      echo "snap"
    elif dpkg -l | grep -q amazon-ssm-agent; then
      echo "apt"
    else
      echo "not_installed"
    fi
  register: ssm_check
  changed_when: false

- name: Install SSM Agent via apt if not installed
  block:
    - name: Creating SSM directory in tmp
      file:
        path: /tmp/ssm
        state: directory
        mode: '0755'

    - name: Install deb file for Debian family 32/64-bit
      apt:
        deb: https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/debian_amd64/amazon-ssm-agent.deb
        state: present
  when: ssm_check.stdout == "not_installed"

- name: Ensure SSM Agent is running
  systemd:
    name: amazon-ssm-agent
    state: started
    enabled: yes
  ignore_errors: true
  register: ssm_service

- name: Check SSM Agent status
  shell: |
    if systemctl is-active amazon-ssm-agent >/dev/null 2>&1; then
      echo "SSM Agent is running via systemd"
      systemctl status amazon-ssm-agent --no-pager | head -3
    elif snap list amazon-ssm-agent 2>/dev/null | grep -q amazon-ssm-agent; then
      echo "SSM Agent installed via snap, checking process..."
      if pgrep -f "amazon-ssm-agent" >/dev/null; then
        echo "SSM Agent process is running"
        ps aux | grep "[a]mazon-ssm-agent" | head -2
      else
        echo "Starting SSM Agent via snap..."
        snap start amazon-ssm-agent || true
        sleep 2
        systemctl start snap.amazon-ssm-agent.amazon-ssm-agent || true
      fi
    else
      echo "SSM Agent not found"
      exit 1
    fi
  register: ssm_status
  changed_when: false

- name: Display SSM Agent status
  debug:
    msg: "{{ ssm_status.stdout_lines }}"

# ==========================================
# Install check-node-by-ip script for Lambda verification
# ==========================================

- name: Copy check-node-by-ip script to master
  copy:
    src: files/check-node-by-ip.sh
    dest: /usr/local/bin/check-node-by-ip.sh
    mode: '0755'
    owner: root
    group: root

- name: Verify check-node-by-ip script is installed
  command: ls -la /usr/local/bin/check-node-by-ip.sh
  register: script_check
  changed_when: false

- name: Display script installation status
  debug:
    msg: "check-node-by-ip.sh installed: {{ script_check.stdout }}"
