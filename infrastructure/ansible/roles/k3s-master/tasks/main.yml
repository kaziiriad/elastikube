---
# K3s Master node setup
- name: Download and install k3s server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-ip={{ ansible_default_ipv4.address }} --tls-san {{ ansible_default_ipv4.address }}" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to be ready
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    delay: 5
    timeout: 300

- name: Set kubeconfig permissions
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: '0644'

- name: Get k3s node token
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false

- name: Get master node IP
  shell: hostname -I | awk '{print $1}'
  register: master_ip
  changed_when: false

- name: Display master info
  debug:
    msg: "Master IP: {{ master_ip.stdout }}, Token: {{ k3s_token.stdout[:20] }}..."

- name: Set master IP as fact for workers
  set_fact:
    master_node_ip: "{{ master_ip.stdout }}"
    k3s_cluster_token: "{{ k3s_token.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['workers'] }}"
  run_once: true

# Store cluster info in S3 for autoscaler Lambda
- name: Upload k3s token to S3 for autoscaler
  aws_s3:
    bucket: "{{ s3_bucket_name }}"
    object: /k3s-token
    content: "{{ k3s_token.stdout }}"
    mode: put
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key | default(omit) }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('ap-southeast-1') }}"
  ignore_errors: true  # May fail if no AWS creds on instance

- name: Upload master IP to S3 for autoscaler
  aws_s3:
    bucket: "{{ s3_bucket_name }}"
    object: /master-ip
    content: "{{ master_ip.stdout }}"
    mode: put
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key | default(omit) }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('ap-southeast-1') }}"
  ignore_errors: true

# Store cluster info in SSM Parameter Store and Secrets Manager
- name: Store master IP in SSM Parameter Store
  aws_ssm_parameter_store:
    name: "/k3s/production-k3s/master-ip"
    value: "{{ master_ip.stdout }}"
    string_type: "String"
    region: "{{ aws_region | default('ap-southeast-1') }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key | default(omit) }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('ap-southeast-1') }}"
  ignore_errors: true

- name: Store k3s join token in Secrets Manager
  aws_secret:
    name: "k3s-production-k3s-join-token"
    secret: "{{ k3s_token.stdout }}"
    region: "{{ aws_region | default('ap-southeast-1') }}"
    state: present
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key | default(omit) }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('ap-southeast-1') }}"
  ignore_errors: true

# ==========================================
# Deploy Monitoring Stack (node-exporter + Prometheus)
# ==========================================

- name: Copy monitoring manifests to master
  copy:
    src: files/
    dest: /tmp/monitoring/
    mode: '0644'

- name: Create monitoring namespace
  command: kubectl apply -f /tmp/monitoring/00-namespace.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy node-exporter DaemonSet
  command: kubectl apply -f /tmp/monitoring/00-node-exporter.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_exporter_deploy

- name: Wait for node-exporter pods to be ready
  command: kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=node-exporter -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: node_exporter_deploy.changed
  ignore_errors: true

- name: Deploy Prometheus service account
  command: kubectl apply -f /tmp/monitoring/01-serviceaccount.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Prometheus ConfigMap with custom scrape config
  command: kubectl apply -f /tmp/monitoring/02-configmap-prometheus.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: prometheus_config

- name: Deploy Prometheus rules ConfigMap
  command: kubectl apply -f /tmp/monitoring/02-configmap-rules.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Prometheus PVC
  command: kubectl apply -f /tmp/monitoring/03-pvc.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy Prometheus deployment
  command: kubectl apply -f /tmp/monitoring/04-deployment.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: prometheus_deploy

- name: Deploy Prometheus services (ClusterIP + NodePort 30900)
  command: kubectl apply -f /tmp/monitoring/05-service.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for Prometheus deployment to be ready
  command: kubectl wait --for=condition=available deployment/prometheus -n monitoring --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: prometheus_deploy.changed
  ignore_errors: true

- name: Get Prometheus service status
  command: kubectl get svc -n monitoring
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: prometheus_status
  changed_when: false

- name: Get node-exporter pods status
  command: kubectl get pods -n kube-system -l app.kubernetes.io/name=node-exporter
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: node_exporter_status
  changed_when: false

- name: Display monitoring stack status
  debug:
    msg:
      - "Prometheus Services:"
      - "{{ prometheus_status.stdout_lines }}"
      - ""
      - "Node Exporter Pods:"
      - "{{ node_exporter_status.stdout_lines }}"

# ==========================================
# Deploy kube-state-metrics
# ==========================================

- name: Deploy kube-state-metrics service account
  command: kubectl apply -f /tmp/monitoring/06-kube-state-metrics-serviceaccount.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy kube-state-metrics cluster role
  command: kubectl apply -f /tmp/monitoring/07-kube-state-metrics-cluster-role.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy kube-state-metrics cluster role binding
  command: kubectl apply -f /tmp/monitoring/08-kube-state-metrics-cluster-role-binding.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Deploy kube-state-metrics deployment
  command: kubectl apply -f /tmp/monitoring/09-kube-state-metrics-deployment.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ksm_deploy

- name: Deploy kube-state-metrics service
  command: kubectl apply -f /tmp/monitoring/10-kube-state-metrics-service.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for kube-state-metrics deployment to be ready
  command: kubectl wait --for=condition=available deployment/kube-state-metrics -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: ksm_deploy.changed
  ignore_errors: true

- name: Get kube-state-metrics status
  command: kubectl get pods -n kube-system -l app.kubernetes.io/name=kube-state-metrics
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ksm_status
  changed_when: false

- name: Display kube-state-metrics status
  debug:
    msg:
      - "kube-state-metrics Pods:"
      - "{{ ksm_status.stdout_lines }}"
