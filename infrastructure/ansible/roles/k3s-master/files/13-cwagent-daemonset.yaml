apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cloudwatch-agent
  namespace: monitoring
  labels:
    app: cloudwatch-agent
spec:
  selector:
    matchLabels:
      app: cloudwatch-agent
  template:
    metadata:
      labels:
        app: cloudwatch-agent
    spec:
      serviceAccountName: cloudwatch-agent
      # Tolerate control-plane taint to run on master
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      # Use pod network for Kubernetes service DNS resolution
      dnsPolicy: ClusterFirst
      containers:
      - name: cloudwatch-agent
        image: public.ecr.aws/cloudwatch-agent/cloudwatch-agent:latest
        # If image pull fails, use amazon-cloudwatch-agent
        # image: amazon/cloudwatch-agent:latest
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 500Mi
        env:
        - name: HOST_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: AWS_REGION
          value: "ap-southeast-1"
        - name: CLUSTER_NAME
          value: "production-k3s"
        - name: CI_VERSION
          value: "k8s/1.3.0"
        volumeMounts:
        - name: cwagentconfig
          mountPath: /etc/cwagentconfig
          readOnly: true
        - name: prometheus-config
          mountPath: /etc/prometheus
          readOnly: true
      volumes:
      - name: cwagentconfig
        configMap:
          name: cloudwatch-agent-config
      - name: prometheus-config
        configMap:
          name: cloudwatch-agent-prometheus-config
