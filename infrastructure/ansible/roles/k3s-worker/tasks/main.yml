---
# K3s Worker node setup
- name: Fetch master IP from master node
  shell: hostname -I | awk '{print $1}'
  register: master_ip
  delegate_to: "{{ groups['master'][0] }}"
  become: false

- name: Fetch k3s token from master node
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  delegate_to: "{{ groups['master'][0] }}"
  become: true

- name: Set master connection info
  set_fact:
    k3s_url: "https://{{ master_ip.stdout }}:6443"
    k3s_token: "{{ k3s_token.stdout }}"

- name: Display join info
  debug:
    msg: "Joining cluster: {{ k3s_url }} with token {{ k3s_token[:20] }}..."

- name: Read EC2 Name tag for k3s-worker label
  shell: "curl -s http://169.254.169.254/latest/meta-data/tags/instance/Name 2>/dev/null || true"
  register: ec2_name_tag
  changed_when: false

- name: Set NODE_NAME fact
  set_fact:
    node_name: "{{ ec2_name_tag.stdout | default(ansible_hostname, true) }}"

- name: Download and install k3s agent
  shell: >
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION={{ k3s_install_version }}
    K3S_URL={{ k3s_url }}
    K3S_TOKEN={{ k3s_token }}
    INSTALL_K3S_EXEC="agent --node-ip={{ ansible_default_ipv4.address }} --node-label k3s-worker={{ node_name }}"
    sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s agent to start
  service:
    name: k3s-agent
    state: started
  become: true

- name: Wait for node to be ready
  shell: kubectl get node {{ ansible_hostname }} --no-headers
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['master'][0] }}"
  register: node_status
  until: node_status.rc == 0 and node_status.stdout.find("Ready") != -1
  retries: 30
  delay: 10
  become: false
