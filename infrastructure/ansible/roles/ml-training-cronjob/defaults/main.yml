---
# ML Training CronJob - Default Variables
# Paths are anchored to the role's own location (role_path), which is
# infrastructure/ansible/roles/ml-training-cronjob/. From there, the
# project root is at ../../../ and ml_training/ is at ../../../ml_training.
# This makes the role work regardless of where the playbook is invoked
# (e.g. from infrastructure/pulumi/, infrastructure/ansible/, or ./).

# Kubernetes namespace
ml_training_namespace: k3s-autoscaler

# ML training container image
ml_training_image: k3s-ml-training:latest

# Docker build configuration
ml_training_context_path: "{{ role_path }}/../../../../ml_training"
ml_training_dockerfile_path: "{{ role_path }}/../../../../ml_training/Dockerfile"

# Node selector - pin to permanent workers to prevent termination during training
# Options:
#   - "k3s-worker-1,k3s-worker-2" - Pin to both permanent workers (round-robin)
#   - "k3s-worker-1" - Pin to specific worker
#   - "" - Allow scheduling on any worker (not recommended)
ml_training_node_selector: "k3s-worker-1,k3s-worker-2"

# AWS configuration
aws_region: ap-southeast-1
# Optional: AWS access keys (only used if not using IRSA/instance profile)
# aws_access_key_id: ""
# aws_secret_access_key: ""

# DynamoDB tables
state_table_name: k3s-cluster-state
wal_table_name: k3s-scaling-wal

# S3 bucket for model storage
s3_bucket_name: k3s-models

# Training parameters
ml_training_days: 30
ml_skip_validation: false

# Base64-encoded bash pipeline that the CronJob container executes.
# Encoded so the YAML doesn't have to nest a literal block inside a list
# inside a list (which has known whitespace issues with multi-line shell).
# The script is regenerated here so all logic stays in one place.
ml_training_b64_script: "{{ lookup('template', 'ml-training-script.sh.j2') | b64encode }}"