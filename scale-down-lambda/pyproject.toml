[project]
name = "worker-cleanup-lambda"
version = "1.0.0"
description = "Lambda function for K3s worker cleanup and scale-down operations"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.forceInclude]
"." = "main.py"
