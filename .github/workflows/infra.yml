name: Deploy Infrastructure

on:
  push:
    branches:
      - master
    paths:
      - 'infrastructure/pulumi/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="/usr/local/bin" sh
          uv pip install pulumi pulumi-aws --system

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi login

      - name: Pulumi stack select
        run: pulumi stack select prod-v3 --cwd infrastructure/pulumi

      - name: Pulumi refresh
        run: pulumi refresh --yes --cwd infrastructure/pulumi

      - name: Pulumi up
        run: pulumi up --yes --cwd infrastructure/pulumi

      - name: Save Pulumi outputs
        run: |
          BASTION_IP=$(pulumi stack output bastion_public_ip --cwd infrastructure/pulumi)
          MASTER_IP=$(pulumi stack output master_private_ip --cwd infrastructure/pulumi)
          WORKER1_IP=$(pulumi stack output worker_1_private_ip --cwd infrastructure/pulumi)
          WORKER2_IP=$(pulumi stack output worker_2_private_ip --cwd infrastructure/pulumi)
          S3_BUCKET=$(pulumi stack output s3_config_bucket --cwd infrastructure/pulumi)

          echo "BASTION_IP=$BASTION_IP" >> $GITHUB_ENV
          echo "MASTER_IP=$MASTER_IP" >> $GITHUB_ENV
          echo "WORKER1_IP=$WORKER1_IP" >> $GITHUB_ENV
          echo "WORKER2_IP=$WORKER2_IP" >> $GITHUB_ENV
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV

          echo "::notice title=Infrastructure Outputs::Bastion: $BASTION_IP | Master: $MASTER_IP | Workers: $WORKER1_IP, $WORKER2_IP"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
