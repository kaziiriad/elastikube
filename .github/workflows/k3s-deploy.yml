name: Deploy K3s Cluster with Ansible

on:
  push:
    branches:
      - master
    paths:
      - 'infrastructure/ansible/**'
      - 'infrastructure/scripts/deploy-k3s.sh'
      - '.github/workflows/k3s-deploy.yml'

  workflow_run:
    workflows: ["Setup Bastion GitHub Runner"]
    types:
      - completed
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy-k3s:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Pulumi
        run: |
          which pulumi || (curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="/usr/local/bin" sh && uv pip install pulumi --system)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi login

      - name: Pulumi stack select
        run: pulumi stack select prod --cwd infrastructure/pulumi

      - name: Pulumi refresh
        run: pulumi refresh --yes --cwd infrastructure/pulumi

      - name: Save infrastructure details
        id: pulumi_outputs
        run: |
          MASTER_IP=$(pulumi stack output master_private_ip --cwd infrastructure/pulumi)
          WORKER1_IP=$(pulumi stack output worker_1_private_ip --cwd infrastructure/pulumi)
          WORKER2_IP=$(pulumi stack output worker_2_private_ip --cwd infrastructure/pulumi)
          S3_BUCKET=$(pulumi stack output s3_config_bucket --cwd infrastructure/pulumi)

          echo "MASTER_IP=$MASTER_IP" >> $GITHUB_ENV
          echo "WORKER1_IP=$WORKER1_IP" >> $GITHUB_ENV
          echo "WORKER2_IP=$WORKER2_IP" >> $GITHUB_ENV
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/my-key-pair.pem
          chmod 600 ~/.ssh/my-key-pair.pem

      - name: Generate Ansible inventory
        run: |
          mkdir -p infrastructure/ansible/inventory

          cat > infrastructure/ansible/inventory/hosts.ini << EOF
          # Ansible Inventory for K3s Autoscaler Production
          # Generated by GitHub Actions

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3

          [master]
          master-node ansible_host=${MASTER_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/my-key-pair.pem

          [workers]
          worker-node-1 ansible_host=${WORKER1_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/my-key-pair.pem
          worker-node-2 ansible_host=${WORKER2_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/my-key-pair.pem

          [k3s_cluster:children]
          master
          workers

          [all:vars]
          s3_bucket_name=${S3_BUCKET}
          aws_region=ap-southeast-1
          EOF

          echo "Generated Ansible inventory:"
          cat infrastructure/ansible/inventory/hosts.ini

      - name: Wait for K3s nodes
        run: |
          echo "Waiting for K3s nodes to be ready..."

          wait_for_node() {
            local node_ip=$1
            local node_name=$2
            for i in {1..60}; do
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                  -i ~/.ssh/my-key-pair.pem ubuntu@$node_ip "echo ready" 2>/dev/null; then
                echo "✓ $node_name is ready"
                return 0
              fi
              echo -n "."
              sleep 3
            done
            echo "✗ $node_name did not become ready"
            return 1
          }

          wait_for_node "${MASTER_IP}" "master"
          wait_for_node "${WORKER1_IP}" "worker-1"
          wait_for_node "${WORKER2_IP}" "worker-2"

      - name: Run Ansible playbook
        run: |
          cd infrastructure/ansible
          ansible-playbook -i inventory/hosts.ini site.yml

      - name: Fetch kubeconfig from master
        run: |
          mkdir -p ~/.kube
          scp -i ~/.ssh/my-key-pair.pem \
              ubuntu@${MASTER_IP}:/etc/rancher/k3s/k3s.yaml \
              ~/.kube/config

          sed -i "s|127.0.0.1|${MASTER_IP}|g" ~/.kube/config

      - name: Verify cluster
        run: |
          export KUBECONFIG=~/.kube/config
          kubectl get nodes
          kubectl get pods -A

      - name: Deployment summary
        run: |
          echo "::notice title=K3s Deployment Complete::Cluster deployed successfully!"
          echo "Master:     ${MASTER_IP}"
          echo "Worker 1:   ${WORKER1_IP}"
          echo "Worker 2:   ${WORKER2_IP}"
