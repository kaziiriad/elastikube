name: Setup Bastion GitHub Runner

on:
  workflow_run:
    workflows: ["Deploy Infrastructure"]
    types:
      - completed
    branches:
      - master

  workflow_dispatch:

jobs:
  setup_runner:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Get Bastion IP from AWS
        id: get_bastion_ip
        run: |
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=k3s-bastion" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [ -z "$BASTION_IP" ] || [ "$BASTION_IP" == "None" ]; then
            echo "Error: Could not find bastion instance"
            exit 1
          fi

          echo "BASTION_IP=$BASTION_IP" >> $GITHUB_ENV
          echo "::notice title=Bastion IP::$BASTION_IP"

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Wait for bastion to be ready
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@${{ env.BASTION_IP }} "echo ready" 2>/dev/null; then
              echo "✓ Bastion is ready"
              break
            fi
            echo -n "."
            sleep 5
          done

      - name: Install GitHub Actions Runner on Bastion
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.BASTION_IP }} << 'EOF'
            set -e

            # Install dependencies
            sudo apt-get update -y
            sudo apt-get install -y curl jq

            # Get runner version and download URL
            RUNNER_VERSION="2.328.0"
            RUNNER_OS="linux-x64"

            if [ ! -d "actions-runner" ]; then
              mkdir -p actions-runner && cd actions-runner

              echo "Downloading GitHub Actions Runner v${RUNNER_VERSION}..."
              curl -o actions-runner-${RUNNER_OS}-${RUNNER_VERSION}.tar.gz -L \
                https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-${RUNNER_OS}-${RUNNER_VERSION}.tar.gz

              echo "Verifying download..."
              echo "01066fad3a2893e63e6ca880ae3a1fad5bf9329d60e77ee15f2b97c148c3cd4e  actions-runner-${RUNNER_OS}-${RUNNER_VERSION}.tar.gz" | shasum -a 256 -c -

              echo "Extracting runner..."
              tar xzf ./actions-runner-${RUNNER_OS}-${RUNNER_VERSION}.tar.gz

              echo "Configuring runner..."
              ./config.sh \
                --url ${{ github.server_url }}/${{ github.repository }} \
                --token ${{ secrets.GIT_RUNNER_TOKEN }} \
                --labels bastion,self-hosted \
                --name bastion-runner \
                --work _work

              echo "Installing runner as service..."
              sudo ./svc.sh install ubuntu

              echo "Starting runner service..."
              sudo ./svc.sh start

              echo "✓ GitHub Actions Runner installed and started"
            else
              echo "actions-runner directory already exists. Restarting service..."
              cd actions-runner
              sudo ./svc.sh restart
              echo "✓ Runner service restarted"
            fi
          EOF

      - name: Install Ansible on Bastion
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.BASTION_IP }} << 'EOF'
            sudo apt-get update -y
            sudo apt install software-properties-common -y
            sudo apt-add-repository --yes --update ppa:ansible/ansible
            sudo apt-get install -y ansible
            ansible --version
          EOF

      - name: Install additional tools on Bastion
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.BASTION_IP }} << 'EOF'
            # Install kubectl
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            kubectl version --client

            # Install jq for JSON parsing
            sudo apt-get install -y jq

            # # Install Pulumi (with sudo for uv)
            # curl -LsSf https://astral.sh/uv/install.sh | sudo env UV_INSTALL_DIR="/usr/local/bin" sh
            # /usr/local/bin/uv pip install pulumi pulumi-aws --break-system-packages

            echo "✓ All tools installed"
          EOF

      - name: Verify runner status
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.BASTION_IP }} << 'EOF'
            cd actions-runner && sudo ./svc.sh status
          EOF

      - name: Setup complete
        run: |
          echo "::notice title=Bastion Runner Setup Complete::GitHub Actions self-hosted runner is now running on bastion at ${{ env.BASTION_IP }}"
